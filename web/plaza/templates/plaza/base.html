<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}跟单广场{% endblock %}</title>
  <style>
    :root { --bg:#0b0e11; --card:#1e2329; --line:#2b3139; --text:#eaecef; --muted:#848e9c; --yellow:#f0b90b; --green:#0ecb81; --red:#f6465d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 28px; border-bottom:1px solid var(--line); }
    header b { font-size:16px; }
    nav { display:flex; gap:16px; align-items:center; }
    a { color:var(--yellow); text-decoration:none; }
    main { max-width:1080px; margin:0 auto; padding:28px 20px 60px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; margin:0 0 8px; }
    .note, .sub { color:var(--muted); }
    .sub { font-size:12px; }
    label { display:block; color:var(--muted); margin:12px 0 6px; }
    input, select { width:100%; background:#0b0e11; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    .filters { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin:12px 0 16px; }
    .filters label { margin:0 0 6px; }
    .filters input, .filters select { width:auto; min-width:140px; }
    button { background:var(--yellow); color:#1e2329; border:0; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer; }
    button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
    .leader { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:12px 20px; align-items:center; }
    .who { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .who strong { font-size:18px; }
    .metrics, .stats { display:flex; gap:28px; flex-wrap:wrap; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .metric span { color:var(--muted); font-size:12px; }
    .metric b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
    .up { color:var(--green); } .down { color:var(--red); }
    .chart, .spark { width:100%; height:auto; display:block; }
    .actions { display:flex; gap:8px; justify-content:flex-end; grid-column:1 / -1; }
    .tabs { display:flex; gap:8px; margin:8px 0 12px; }
    .tabs a { color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 12px; }
    .tabs a.on { color:#1e2329; background:var(--yellow); border-color:var(--yellow); }
    .tag { border-radius:999px; padding:2px 8px; font-size:12px; color:var(--green); background:rgba(14,203,129,.12); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; }
    .err { color:var(--red); }
    code { color:var(--yellow); }
    @media (max-width:720px) { .leader, .stats { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <b><a href="/" style="color:inherit">跟单广场</a></b>
    <nav>
      <a href="{% url 'signals' %}">实时信号</a>
      {% if user.is_staff %}<a href="{% url 'wallets' %}">钱包</a>{% endif %}
      {% if user.is_authenticated %}
        <a href="{% url 'me' %}">我的跟单</a>
        <a href="{% url 'invite' %}">推广</a>
        <a href="{% url 'logout' %}">退出</a>
      {% else %}
        <a href="{% url 'login' %}">登录</a>
        <a href="{% url 'register' %}">注册</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
