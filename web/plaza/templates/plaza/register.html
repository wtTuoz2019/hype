{% extends "plaza/base.html" %}
{% block title %}注册{% endblock %}
{% block body %}
  <h1>注册</h1>
  <div class="card" style="max-width:420px">
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>账号</label>
      <input name="username" required maxlength="32" autocomplete="username">
      <label>密码</label>
      <input name="password" type="password" required minlength="8" autocomplete="new-password">
      <label>再输入一次密码</label>
      <input name="password2" type="password" required minlength="8" autocomplete="new-password">
      <label>邀请码</label>
      <input name="code" value="{{ code }}" placeholder="可以留空">
      <div style="margin-top:16px"><button type="submit">注册</button></div>
    </form>
  </div>
{% endblock %}
